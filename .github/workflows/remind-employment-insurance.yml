name: Remind Dong-gu employment insurance data refresh

# 고용·산재보험 파일은 연 1회 수동으로 교체한다. 매년 연말 갱신 Issue를 만든다.
on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron is UTC: December 31, 09:00 KST.
    - cron: "0 0 31 12 *"

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Create annual refresh issue
        uses: actions/github-script@v7
        with:
          script: |
            const year = new Date().getUTCFullYear();
            const title = `[고용·산재보험 자료] ${year}년 연말 갱신 확인`;
            const query = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`;
            const { data: searchResult } = await github.rest.search.issuesAndPullRequests({
              q: query,
              per_page: 10
            });
            const alreadyOpen = searchResult.items.some((issue) => !issue.pull_request && issue.title === title);
            if (alreadyOpen) {
              core.info(`이미 열린 갱신 Issue가 있습니다: ${title}`);
              return;
            }

            const body = [
              "## 갱신 대상",
              "근로복지공단 `고용 산재보험 가입 현황` 최신 파일을 확인하고 광주 동구 자료를 갱신하세요.",
              "",
              "## 갱신 절차",
              "1. 최신 CP949 CSV를 `data/employment_insurance_donggu.csv`로 교체합니다.",
              "2. 원본 기준일을 넣어 `npm run update-employment-insurance -- --source-updated-at YYYY-MM-DD`를 실행합니다.",
              "3. `npm test`를 실행합니다.",
              "4. `data/employment_insurance_donggu.csv`와 `data/employment_insurance_donggu.json`을 함께 커밋·푸시합니다.",
              "",
              "변환 스크립트는 17개 필수 열, 행별 열 개수, 연번 중복, 보험구분 값과 날짜·근로자 수 형식을 검사합니다."
            ].join("\n");

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body
            });
