name: Update Gwangju sole proprietor profile

on:
  workflow_dispatch:
  # 자료는 연 1회 갱신이지만 새 기준년월이 언제 붙을지 공지되지 않는다.
  # 지역당 몇 번이면 끝나는 호출이라 매월 확인만 하고 변화가 없으면 커밋하지 않는다.
  schedule:
    - cron: "0 18 5 * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run update-sbprofile
        env:
          FSC_SB_KEY: ${{ secrets.FSC_SB_KEY }}
      - run: npm test
      - name: Commit updated data
        run: |
          if git diff --quiet -- data/sbprofile_gwangju.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sbprofile_gwangju.json
          git commit -m "Update Gwangju sole proprietor profile data"
          git push
