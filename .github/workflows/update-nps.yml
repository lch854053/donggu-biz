name: Update Dong-gu NPS snapshot

# 국민연금 사업장 스냅샷은 사업장마다 상세조회를 한 번씩 더 부르므로 호출 수가 많다.
# 화면에서 실시간으로 할 일이 아니라 월 1회 배치로 돌리고, 필요하면 손으로도 돌린다.
# 상가 데이터 수집(매월 5일 03시 KST)과 겹치지 않게 하루 뒤로 둔다.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 19 5 * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check service key
        env:
          NPS_SERVICE_KEY: ${{ secrets.NPS_SERVICE_KEY }}
        run: |
          if [ -z "$NPS_SERVICE_KEY" ]; then
            echo "NPS_SERVICE_KEY 저장소 Secret이 없습니다. 디코딩 키를 등록한 뒤 다시 실행하세요." >&2
            exit 1
          fi
      - run: npm run update-nps
        env:
          NPS_SERVICE_KEY: ${{ secrets.NPS_SERVICE_KEY }}
      - run: npm test
      - name: Commit updated snapshot
        run: |
          # 스냅샷이 아직 저장소에 없을 때는 추적되지 않는 파일이라 git diff에 잡히지 않는다.
          # 먼저 add 한 뒤 색인과 비교해야 첫 수집분도 커밋된다.
          git add data/nps_donggu.json
          if git diff --cached --quiet -- data/nps_donggu.json; then
            echo "집계가 그대로라 커밋할 것이 없습니다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Dong-gu NPS workplace snapshot"
          git push
