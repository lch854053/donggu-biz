name: Remind Dong-gu academies data refresh

# NEIS 학원교습소정보는 Open API가 아니라 시트(CSV)로만 내려온다. 매년 연초에
# 새 시트를 받아 교체할 수 있도록 갱신 Issue를 만든다.
on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron is UTC: January 2, 09:00 KST.
    - cron: "0 0 2 1 *"

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Create annual refresh issue
        uses: actions/github-script@v7
        with:
          script: |
            const year = new Date().getUTCFullYear();
            const title = `[학원·교습소 자료] ${year}년 연초 갱신 확인`;
            const query = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`;
            const { data: searchResult } = await github.rest.search.issuesAndPullRequests({
              q: query,
              per_page: 10
            });
            const alreadyOpen = searchResult.items.some((issue) => !issue.pull_request && issue.title === title);
            if (alreadyOpen) {
              core.info(`이미 열린 갱신 Issue가 있습니다: ${title}`);
              return;
            }

            const body = [
              "## 갱신 대상",
              "NEIS(나이스 교육정보 개방 포털) `학원교습소정보` 시트의 광주 동구 자료를 갱신하세요. 학원·교습소는 Open API가 없어 매년 시트(CSV)를 받아 교체합니다.",
              "",
              "## 갱신 절차",
              "1. [NEIS 학원교습소정보](https://open.neis.go.kr/portal/data/service/selectServicePage.do?infId=OPEN19220231012134453534385&infSeq=1)에서 최신 CSV를 내려받아 `data/academies_donggu.csv`로 교체합니다.",
              "2. 원본 기준일을 넣어 `npm run update-academies -- --source-updated-at YYYY-MM-DD`를 실행합니다.",
              "3. `npm test`를 실행합니다.",
              "4. `data/academies_donggu.csv`와 `data/academies_donggu.json`을 함께 커밋·푸시합니다.",
              "",
              "변환 스크립트는 25개 열 구성, 행별 열 개수, 학원지정번호 중복, 등록상태명 값과 날짜·정원·수강료 형식을 검사합니다. 등록상태명에 새 값이 생기면 `scripts/import-academies.mjs`의 `STATUS_NAMES`에 추가해야 합니다."
            ].join("\n");

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body
            });
