name: Update Dong-gu academies via NEIS API

# NEIS 학원교습소정보 API(openapi.neis.go.kr)로 학원·교습소 스냅샷을 다시 쓴다.
# 이 API는 사내망에서 막혀 있어 로컬이 아니라 Actions에서 돌린다.
on:
  workflow_dispatch:
  schedule:
    # 2·5·8·11월 3일 09:00(KST). 분기 갱신이면 충분한 자료다.
    - cron: "0 0 3 2,5,8,11 *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run update-academies-neis
        env:
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
      - run: npm test
      - name: Commit updated data
        run: |
          if git diff --quiet -- data/academies_donggu.csv data/academies_donggu.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/academies_donggu.csv data/academies_donggu.json
          git commit -m "Update Dong-gu academies data"
          git fetch origin main
          git rebase origin/main
          git push
