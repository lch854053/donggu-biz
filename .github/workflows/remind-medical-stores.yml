name: Remind Dong-gu medical data refresh

# 의료기관 파일은 연 1회 수동으로 교체한다. 매년 9월 초 갱신 Issue를 만든다.
on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron is UTC: September 1, 09:00 KST.
    - cron: "0 0 1 9 *"

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Create annual refresh issue
        uses: actions/github-script@v7
        with:
          script: |
            const year = new Date().getUTCFullYear();
            const title = `[의료기관 자료] ${year}년 갱신 필요`;
            const query = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`;
            const { data: searchResult } = await github.rest.search.issuesAndPullRequests({
              q: query,
              per_page: 10
            });
            const alreadyOpen = searchResult.items.some((issue) => !issue.pull_request && issue.title === title);
            if (alreadyOpen) {
              core.info(`이미 열린 갱신 Issue가 있습니다: ${title}`);
              return;
            }

            const body = [
              "## 갱신 대상",
              "소상공인시장진흥공단 `상가(상권)정보_의료기관` 파일을 확인하고 동구 자료를 갱신하세요.",
              "",
              "## 갱신 절차",
              "1. 최신 CSV를 `data/medical_stores_donggu.csv`로 교체합니다.",
              "2. CSV에 표시된 자료 갱신일을 넣어 `npm run update-medical-stores -- --source-updated-at YYYY-MM-DD`를 실행합니다.",
              "3. `npm test`를 실행합니다.",
              "4. `data/medical_stores_donggu.csv`와 `data/medical_stores_donggu.json`을 함께 커밋·푸시합니다.",
              "",
              "갱신 스크립트는 광주 동구 코드(`29`, `29110`)만 남기고 상가업소번호 중복과 좌표 누락을 검사합니다."
            ].join("\n");

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body
            });
