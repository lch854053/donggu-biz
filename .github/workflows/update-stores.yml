name: Update Dong-gu stores

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 4 * *"
  # 워크플로우나 파이프라인 스크립트를 고치면 갱신 전체를 다시 검증한다. dispatch
  # 권한 없이도 갱신을 돌릴 수 있는 통로로도 쓴다.
  push:
    paths:
      - ".github/workflows/update-stores.yml"
      - "scripts/update-stores.mjs"
      - "scripts/update-closed-licenses.mjs"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run update-stores
        env:
          SDSC_SERVICE_KEY: ${{ secrets.SDSC_SERVICE_KEY }}
          LOCALDATA_SERVICE_KEY: ${{ secrets.LOCALDATA_SERVICE_KEY || secrets.SDSC_SERVICE_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          VWORLD_KEY: ${{ secrets.VWORLD_KEY }}
          VWORLD_DOMAIN: https://donggu-biz.vercel.app
      - run: npm run update-zones
        env:
          VWORLD_KEY: ${{ secrets.VWORLD_KEY }}
          VWORLD_DOMAIN: https://donggu-biz.vercel.app
      - run: npm run update-closed-licenses
        env:
          LOCALDATA_SERVICE_KEY: ${{ secrets.LOCALDATA_SERVICE_KEY || secrets.SDSC_SERVICE_KEY }}
      - run: npm test
      - name: Commit updated data
        run: |
          if git diff --quiet -- data/stores_donggu.json data/closed_licenses_donggu.json data/mainbiz_zones_donggu.geojson; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stores_donggu.json data/closed_licenses_donggu.json data/mainbiz_zones_donggu.geojson
          git commit -m "Update Dong-gu commerce data"
          # 갱신 도중 main이 앞서 있으면 밀어넣기가 막히므로 리베이스 후 누른다.
          git fetch origin main
          git rebase origin/main
          git push
