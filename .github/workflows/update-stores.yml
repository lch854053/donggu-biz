name: Update Dong-gu stores

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 4 * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run update-stores
        env:
          SDSC_SERVICE_KEY: ${{ secrets.SDSC_SERVICE_KEY }}
      - run: npm test
      - name: Commit updated data
        run: |
          if git diff --quiet -- data/stores_donggu.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stores_donggu.json
          git commit -m "Update Dong-gu store data"
          git push
